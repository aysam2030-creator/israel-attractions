include ':app'

def cordovaProject = new File('./capacitor-cordova-android-plugins/')
if (cordovaProject.exists() && new File(cordovaProject, 'build.gradle').exists()) {
    include ':capacitor-cordova-android-plugins'
    project(':capacitor-cordova-android-plugins').projectDir = cordovaProject
}

apply from: 'capacitor.settings.gradle'