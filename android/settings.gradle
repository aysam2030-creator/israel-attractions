
// ⚡ Bolt Workaround (Per explicit agent instructions):
// To fix Android CI build errors concerning missing `capacitor-cordova-android-plugins` files
// (which occurs because `npx cap sync android` isn't run in CI and the folder is gitignored),
// dynamically create a minimal stub.
def cordovaPluginsDir = new File('./capacitor-cordova-android-plugins/')
if (!cordovaPluginsDir.exists()) {
    cordovaPluginsDir.mkdirs()
    new File(cordovaPluginsDir, 'build.gradle').text = '''
        apply plugin: 'com.android.library'
        android {
            namespace "capacitor.cordova.android.plugins"
            compileSdk 34
        }
    '''
    new File(cordovaPluginsDir, 'cordova.variables.gradle').text = 'ext {}'
}

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'