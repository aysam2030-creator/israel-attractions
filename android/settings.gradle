include ':app'
include ':capacitor-cordova-android-plugins'

def cordovaPluginsDir = new File(settingsDir, 'capacitor-cordova-android-plugins')
if (!cordovaPluginsDir.exists()) {
    cordovaPluginsDir.mkdirs()
}
def buildGradle = new File(cordovaPluginsDir, 'build.gradle')
if (!buildGradle.exists()) {
    buildGradle.write("apply plugin: 'com.android.library'\nandroid {\n    namespace 'capacitor.cordova.android.plugins'\n    compileSdk 34\n}\n")
}
def cordovaVariables = new File(cordovaPluginsDir, 'cordova.variables.gradle')
if (!cordovaVariables.exists()) {
    cordovaVariables.write("ext {}\n")
}

project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'
