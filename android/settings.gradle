include ':app'
include ':capacitor-cordova-android-plugins'

def cordovaPluginDir = new File(settingsDir, 'capacitor-cordova-android-plugins')
if (!cordovaPluginDir.exists()) {
    cordovaPluginDir.mkdirs()
    new File(cordovaPluginDir, 'build.gradle').text = '''
apply plugin: 'com.android.library'
android {
    namespace "capacitor.cordova.android.plugins"
    compileSdk 34
}
'''
    new File(cordovaPluginDir, 'cordova.variables.gradle').text = 'ext {}'
}

project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'