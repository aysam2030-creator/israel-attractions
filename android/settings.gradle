include ':app'
include ':capacitor-cordova-android-plugins'

// Workaround for CI failing when missing capacitor plugins build/variables gradle file
def cordovaPluginsDir = new File('./capacitor-cordova-android-plugins/')
if (!cordovaPluginsDir.exists()) {
    cordovaPluginsDir.mkdirs()
}

def cordovaVariablesFile = new File(cordovaPluginsDir, 'cordova.variables.gradle')
if (!cordovaVariablesFile.exists()) {
    cordovaVariablesFile.text = 'ext {}'
}

def cordovaBuildFile = new File(cordovaPluginsDir, 'build.gradle')
if (!cordovaBuildFile.exists()) {
    cordovaBuildFile.text = '''
apply plugin: 'com.android.library'
android {
    namespace = "capacitor.cordova.android.plugins"
    compileSdk = 36
    defaultConfig {
        minSdkVersion 24
    }
}
'''
}

project(':capacitor-cordova-android-plugins').projectDir = cordovaPluginsDir

apply from: 'capacitor.settings.gradle'